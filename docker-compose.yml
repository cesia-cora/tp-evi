services:
  db:
    image: postgres:16-alpine
    container_name: pyme_db
    restart: always
    environment:
      POSTGRES_DB: pyme
      POSTGRES_USER: admin_pyme
      POSTGRES_PASSWORD: password_seguro_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pyme_network

  api:
    build: .
    container_name: pyme_api
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=pyme
      - DB_USER=admin_pyme
      - DB_PASSWORD=password_seguro_123
      - DB_HOST=db
    depends_on:
      - db
    networks:
      - pyme_network

volumes:
  postgres_data:

networks:
  pyme_network:
    driver: bridge
